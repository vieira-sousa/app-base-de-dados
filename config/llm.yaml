# LLM local via Ollama (https://ollama.com). Nada sai do computador.
# Por segurança, só são aceites URLs localhost.
ativo: true
url: http://localhost:11434
# Modelos sugeridos (testar com os seus PDFs e escolher o melhor):
#   qwen2.5:7b      ~5 GB RAM  — bom português e JSON, corre em CPU (lento) ou GPU
#   qwen2.5:14b     ~9 GB RAM  — mais preciso, precisa de mais memória
#   gemma3:12b      ~8 GB RAM
#   llama3.1:8b     ~5 GB RAM
modelo: qwen2.5:7b
temperatura: 0.0
contexto_tokens: 8192          # aumentar (16384) se os relatórios forem longos e houver RAM
max_caracteres_documento: 20000
timeout_s: 600
