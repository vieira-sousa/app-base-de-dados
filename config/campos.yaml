# =============================================================================
#  ESQUEMA DE CAMPOS A EXTRAIR
# =============================================================================
#  Cada campo define O QUÊ extrair, DE QUE tipo de documento e COMO.
#
#  tipo       : texto | inteiro | decimal | data | booleano | categoria
#  documento  : anatomia_patologica | analises | cirurgia
#  metodo     : regex   -> só expressões regulares (rápido, determinístico)
#               llm     -> só LLM local (texto livre, contexto clínico)
#               hibrido -> ambos; se discordarem o campo é marcado para revisão
#  regex      : nome de um extrator incluído (ver extrator/regras/*.py)
#  padrao     : OU uma expressão regular própria (1.º grupo de captura = valor)
#  mapa       : (opcional) normalização de valores capturados -> valor final
#  opcoes     : (categoria) valores permitidos
#  prioridade : regex | llm  -> qual vence em caso de discordância (default regex)
#  descricao  : usada no prompt do LLM — seja específico.
#
#  Para adicionar uma variável nova basta acrescentar um bloco aqui.
# =============================================================================

campos:

  # ---------------------------------------------------------------- CIRURGIA
  - nome: data_cirurgia
    descricao: Data em que a cirurgia foi realizada (AAAA-MM-DD)
    tipo: data
    documento: cirurgia
    metodo: hibrido
    regex: cirurgia.data_cirurgia

  - nome: procedimento
    descricao: Nome do procedimento cirúrgico principal realizado (ex. hemicolectomia direita, resseção anterior do reto, gastrectomia total, duodenopancreatectomia cefálica)
    tipo: texto
    documento: cirurgia
    metodo: llm

  - nome: abordagem
    descricao: Via de abordagem cirúrgica
    tipo: categoria
    opcoes: [laparoscopica, robotica, aberta, convertida]
    documento: cirurgia
    metodo: hibrido
    regex: cirurgia.abordagem

  - nome: conversao
    descricao: Houve conversão de laparoscopia/robótica para cirurgia aberta?
    tipo: booleano
    documento: cirurgia
    metodo: hibrido
    regex: cirurgia.conversao

  - nome: perdas_hematicas_ml
    descricao: Perdas hemáticas estimadas em mL (0 se descritas como mínimas/desprezíveis)
    tipo: inteiro
    documento: cirurgia
    metodo: hibrido
    regex: cirurgia.perdas_hematicas_ml

  - nome: duracao_cirurgia_min
    descricao: Duração da cirurgia em minutos
    tipo: inteiro
    documento: cirurgia
    metodo: hibrido
    regex: cirurgia.duracao_min

  - nome: anastomose
    descricao: Foi realizada anastomose?
    tipo: booleano
    documento: cirurgia
    metodo: llm

  - nome: anastomose_tecnica
    descricao: Técnica da anastomose
    tipo: categoria
    opcoes: [manual, mecanica, mista]
    documento: cirurgia
    metodo: hibrido
    regex: cirurgia.anastomose_tecnica

  - nome: estoma
    descricao: Tipo de estoma construído na cirurgia
    tipo: categoria
    opcoes: [nenhum, ileostomia, colostomia]
    documento: cirurgia
    metodo: hibrido
    regex: cirurgia.estoma

  - nome: intercorrencias_intraop
    descricao: Intercorrências ou complicações intraoperatórias descritas (texto curto; null se nenhuma)
    tipo: texto
    documento: cirurgia
    metodo: llm

  # ----------------------------------------------------- ANATOMIA PATOLÓGICA
  - nome: tipo_histologico
    descricao: Tipo histológico do tumor (ex. adenocarcinoma, adenocarcinoma mucinoso, carcinoma de células em anel de sinete)
    tipo: texto
    documento: anatomia_patologica
    metodo: llm

  - nome: grau_diferenciacao
    descricao: Grau de diferenciação histológica
    tipo: categoria
    opcoes: [G1, G2, G3, G4, baixo_grau, alto_grau]
    documento: anatomia_patologica
    metodo: hibrido
    regex: ap.grau_diferenciacao

  - nome: ptnm_prefixo
    descricao: Prefixo do estadiamento patológico (y = pós-terapêutica neoadjuvante; r = recidiva). null se nenhum.
    tipo: categoria
    opcoes: [y, r, yr]
    documento: anatomia_patologica
    metodo: regex
    regex: ap.ptnm_prefixo

  - nome: pT
    descricao: Categoria pT (ex. Tis, T1, T2, T3, T4a, T4b)
    tipo: texto
    documento: anatomia_patologica
    metodo: hibrido
    regex: ap.pt

  - nome: pN
    descricao: Categoria pN (ex. N0, N1a, N1b, N1c, N2a, N2b)
    tipo: texto
    documento: anatomia_patologica
    metodo: hibrido
    regex: ap.pn

  - nome: pM
    descricao: Categoria pM (M1, M1a, M1b, M1c). null se não referido.
    tipo: texto
    documento: anatomia_patologica
    metodo: regex
    regex: ap.pm

  - nome: ganglios_examinados
    descricao: Número total de gânglios linfáticos examinados
    tipo: inteiro
    documento: anatomia_patologica
    metodo: hibrido
    regex: ap.ganglios_examinados

  - nome: ganglios_positivos
    descricao: Número de gânglios linfáticos com metástase
    tipo: inteiro
    documento: anatomia_patologica
    metodo: hibrido
    regex: ap.ganglios_positivos

  - nome: margem_r
    descricao: Classificação da margem de resseção (R0, R1, R2)
    tipo: categoria
    opcoes: [R0, R1, R2, Rx]
    documento: anatomia_patologica
    metodo: hibrido
    regex: ap.margem_r

  - nome: margem_circunferencial_mm
    descricao: Distância à margem circunferencial / radial em mm
    tipo: decimal
    documento: anatomia_patologica
    metodo: hibrido
    regex: ap.margem_circunferencial_mm

  - nome: tamanho_tumor_cm
    descricao: Maior dimensão do tumor em cm
    tipo: decimal
    documento: anatomia_patologica
    metodo: hibrido
    regex: ap.tamanho_tumor_cm

  - nome: invasao_linfovascular
    descricao: Invasão linfovascular / linfática presente?
    tipo: booleano
    documento: anatomia_patologica
    metodo: hibrido
    regex: ap.invasao_linfovascular

  - nome: invasao_venosa
    descricao: Invasão venosa presente?
    tipo: booleano
    documento: anatomia_patologica
    metodo: hibrido
    regex: ap.invasao_venosa

  - nome: invasao_perineural
    descricao: Invasão perineural presente?
    tipo: booleano
    documento: anatomia_patologica
    metodo: hibrido
    regex: ap.invasao_perineural

  - nome: grau_regressao
    descricao: Grau de regressão tumoral após neoadjuvância, com o sistema usado (ex. "Mandard 3", "TRG 2", "Dworak 3")
    tipo: texto
    documento: anatomia_patologica
    metodo: hibrido
    regex: ap.grau_regressao

  - nome: estado_mmr
    descricao: Estado das proteínas de reparação (MMR) por imunohistoquímica
    tipo: categoria
    opcoes: [pMMR, dMMR]
    documento: anatomia_patologica
    metodo: llm


# =============================================================================
#  ANÁLISES CLÍNICAS
# =============================================================================
#  Cada parâmetro gera um campo "<nome>". Os valores são extraídos por regex
#  (tabelas numéricas são onde os LLM pequenos mais erram).
#
#  regra: qual valor escolher quando há vários relatórios/datas
#    ultimo_antes_cirurgia | primeiro_apos_cirurgia | ultimo | primeiro | maximo | minimo
#  janela_dias: (opcional) só considera valores até N dias da cirurgia
# =============================================================================

analises:
  - nome: cea_preop
    aliases: ["CEA", "Antigénio carcinoembrionário", "Antigenio carcinoembrionario", "Ag. carcinoembrionário"]
    unidade: ng/mL
    regra: ultimo_antes_cirurgia
    janela_dias: 90

  - nome: ca19_9_preop
    aliases: ["CA 19-9", "CA 19.9", "CA19-9", "CA19.9"]
    unidade: U/mL
    regra: ultimo_antes_cirurgia
    janela_dias: 90

  - nome: hemoglobina_preop
    aliases: ["Hemoglobina", "Hgb", "Hb"]
    unidade: g/dL
    regra: ultimo_antes_cirurgia
    janela_dias: 30

  - nome: leucocitos_preop
    aliases: ["Leucócitos", "Leucocitos", "Leuc."]
    unidade: x10^9/L
    regra: ultimo_antes_cirurgia
    janela_dias: 30

  - nome: plaquetas_preop
    aliases: ["Plaquetas", "PLT"]
    unidade: x10^9/L
    regra: ultimo_antes_cirurgia
    janela_dias: 30

  - nome: albumina_preop
    aliases: ["Albumina"]
    unidade: g/dL
    regra: ultimo_antes_cirurgia
    janela_dias: 30

  - nome: creatinina_preop
    aliases: ["Creatinina"]
    unidade: mg/dL
    regra: ultimo_antes_cirurgia
    janela_dias: 30

  - nome: pcr_max_pos_op
    aliases: ["Proteína C reactiva", "Proteína C reativa", "Proteina C reactiva", "Proteina C reativa", "PCR"]
    unidade: mg/dL
    regra: maximo_apos_cirurgia
    janela_dias: 7
